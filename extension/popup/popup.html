<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>投稿リサーチ</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>投稿リサーチ</h1>
      <button id="open-settings" class="link" type="button">連携設定</button>
    </header>

    <!-- 連携設定（スタジオで発行した連携コードを入れる） -->
    <section id="settings-view" hidden>
      <p class="note">
        Threads 投稿スタジオの「拡張機能」ページで発行した<strong>連携コード</strong>を入力してください。承認済みの購入者だけが使えます。
      </p>
      <label>スタジオのURL
        <input id="studio-url" type="url" placeholder="https://xxxx.workers.dev" autocomplete="off" />
      </label>
      <label>連携コード
        <input id="token" type="password" placeholder="tsx_..." autocomplete="off" />
      </label>
      <button id="save-settings" type="button" class="primary">確認して保存</button>
      <p id="settings-message" class="message" role="status"></p>
    </section>

    <!-- 収集と書き出し -->
    <section id="main-view" hidden>
      <p id="status" class="status" role="status"></p>

      <div id="controls" hidden>
        <label class="check"><input id="only-account" type="checkbox" checked /> <span id="only-account-label">このアカウントの投稿だけ</span></label>
        <div class="grid">
          <label>並べ方
            <select id="sort-by">
              <option value="likes">いいねが多い順</option>
              <option value="replies">返信が多い順</option>
              <option value="reposts">再投稿・引用が多い順</option>
              <option value="engagement">反応の合計が多い順</option>
              <option value="newest">新しい順</option>
            </select>
          </label>
          <label>件数
            <select id="limit">
              <option value="10">上位10件</option>
              <option value="20" selected>上位20件</option>
              <option value="30">上位30件</option>
              <option value="50">上位50件</option>
              <option value="0">すべて</option>
            </select>
          </label>
          <label>期間
            <select id="since-days">
              <option value="0">すべて</option>
              <option value="7">7日以内</option>
              <option value="30">30日以内</option>
              <option value="90">90日以内</option>
            </select>
          </label>
          <label>いいね数の下限
            <input id="min-likes" type="number" min="0" value="0" />
          </label>
        </div>
        <label class="check"><input id="exclude-replies" type="checkbox" checked /> 他人への返信は除く</label>
        <label class="check"><input id="include-tree" type="checkbox" checked /> ツリー（続きの投稿）も入れる</label>
        <label class="check"><input id="include-prompt" type="checkbox" checked /> AIへの分析のお願い文を付ける</label>

        <p id="selection" class="selection"></p>

        <div class="buttons">
          <button id="copy-md" type="button" class="primary">AI用にコピー</button>
          <button id="download-csv" type="button">CSVで保存</button>
        </div>

        <div class="studio">
          <label>スタジオに送って分析する
            <select id="account-id"><option value="">（アカウントを選ばない）</option></select>
          </label>
          <button id="send-studio" type="button" class="primary">スタジオに送る</button>
        </div>

        <p id="message" class="message" role="status"></p>
        <div class="footer-buttons">
          <button id="clear" type="button" class="link">集めた投稿をリセット</button>
          <button id="diagnostics" type="button" class="link">診断情報をコピー</button>
        </div>
      </div>
      <p class="note small">
        ページを下にスクロールすると、表示された投稿が自動で集まります。集めたデータはこのブラウザの中だけで扱い、「スタジオに送る」を押したときだけ、あなたのスタジオに送られます。投稿の文章をそのまま使わず、伸びている理由（構造）を学ぶために使ってください。
      </p>
    </section>

    <script src="../src/parser.js"></script>
    <script src="../src/export.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
